<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/home.css">
    <title>Home</title>
    <link rel="shortcut icon" type="imagex/png" href="/static/logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="container d-flex justify-content-center align-items-center">

<div class="card p-3 m-2 d-flex justify-content-center align-items-center">

    <img src="/static/logo.png" width="50%">

    <h1>Login</h1>
    <form action="{{ url_for('login') }}" method="POST" class="d-flex flex-column justify-content-center align-items-center mt-3">
        <label class="form-label w-100 p-1">
            <input class="form-control w-100" type="text" name="form_cpf" placeholder="CPF">
        </label>
        <label class="form-label w-100 p-1 password">
            <input class="form-control w-100" type="password" name="form_senha" placeholder="Senha">
        </label>
        <button class="btn btn-primary w-50 m-3" role="button">Entrar</button>
    </form>


</div>


</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
