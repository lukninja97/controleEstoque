<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="shortcut icon" type="imagex/png" href="/static/logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/home-bootstrap.css">
</head>
<body>
<div class="conteiner d-flex flex-column">

    <nav class="navbar bg-body-tertiary">
        <div class="container-fluid d-flex justify-content-between">
            <a class="navbar-brand" href="#">
                <img src="/static/logo.png" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                Estoquix
            </a>
            <div>
                <ul class="navbar-nav d-flex flex-row">
                    <li class="nav-item dropdown me-2">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown"
                           aria-expanded="true">
                            Ola {{ user_on.nome }}
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Action</a></li>
                            <li><a class="dropdown-item" href="#">Another action</a></li>
                        </ul>
                    </li>
                    <li class="perfil nav-item">
                        <i class="bi bi-person-circle h-100"></i>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="d-flex">
        <div class="side-bar d-flex flex-column flex-shrink-0 p-2 col-2 h-100">

            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a href="{{ url_for("dashboard") }}" class="lia nav-link">
                        <i class="bi bi-speedometer me-2"></i>
                        Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{{ url_for("listar_usuarios") }}" class="lia nav-link">
                        <i class="bi bi-people me-2"></i>
                        Usuários
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="lia nav-link">
                        <i class="bi bi-tags me-2"></i>
                        Categorias
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="lia nav-link">
                        <i class="bi bi-bag me-2"></i>
                        Produtos
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="lia nav-link">
                        <i class="bi bi-arrow-up me-2"></i>
                        Entradas
                    </a>
                </li>
                <li class="nav-item">
                    <a href="#" class="lia nav-link">
                        <i class="bi bi-arrow-down me-2"></i>
                        Saídas
                    </a>
                </li>
            </ul>
        </div>

        <div class="block w-100">

            {% block content %}

            {% endblock %}
        </div>
    </main>
</div>

</body>
</html>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js"></script>
